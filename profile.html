<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243b">
  <title>Student Profile | Digital Laboratory</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    body{min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#dceafe 0,transparent 38%),var(--bg)}
    .profile-page{max-width:1060px;margin:0 auto;padding:26px 24px 60px}
    .profile-nav{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:#ffffffdc;box-shadow:0 12px 35px #14264b0b}
    .profile-brand{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--navy)}
    .back-link{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy);font-size:11px;font-weight:700;text-decoration:none}
    .back-link:hover{border-color:#9db4e9;background:#f5f8ff}
    .profile-hero{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:24px;margin-top:24px;padding:30px;border:1px solid #d8e3ef;border-radius:22px;background:linear-gradient(125deg,#fff,#f3f8ff);box-shadow:0 18px 50px #14264b12}
    .profile-avatar{width:104px;height:104px;display:grid;place-items:center;overflow:hidden;border:4px solid #fff;border-radius:50%;background:#e8f2ff;color:#176b72;font-size:29px;font-weight:850;box-shadow:0 8px 25px #14264b1c}
    .profile-avatar img{width:100%;height:100%;object-fit:cover}
    .eyebrow{margin:0 0 8px;color:#2764b0;font-size:10px;font-weight:850;letter-spacing:1.8px}
    .profile-hero h1{margin:0;color:#152a46;font-size:32px;line-height:1.2}
    .profile-headline{margin:8px 0 0;color:#64758b;font-size:14px}
    .profile-links{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}
    .profile-links:empty{display:none}
    .profile-links a{padding:9px 13px;border:1px solid #c9d9ef;border-radius:10px;background:#eef5ff;color:#24589a;font-size:11px;font-weight:750;text-decoration:none}
    .profile-links a:hover{background:#e1edff}
    .profile-content{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    .profile-panel{padding:23px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px #14264b0b}
    .panel-heading{display:flex;align-items:center;gap:11px;margin-bottom:18px}
    .panel-mark{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:#eaf2ff;color:#2861aa;font-size:11px;font-weight:900}
    .panel-heading h2{margin:0;color:#192e49;font-size:16px}
    .panel-heading p{margin:4px 0 0;color:#718198;font-size:10px}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .detail{min-width:0;padding:12px;border:1px solid #e7edf5;border-radius:12px;background:#f8faff}
    .detail dt{color:#718198;font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
    .detail dd{margin:6px 0 0;color:#1c3049;font-size:12px;font-weight:700;overflow-wrap:anywhere}
    .professional-copy{margin:0 0 18px;color:#687a90;font-size:12px;line-height:1.7}
    .resume-card{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid #dce6f2;border-radius:14px;background:linear-gradient(110deg,#f4f8ff,#f8fbff)}
    .resume-icon{width:43px;height:48px;display:grid;place-items:center;border-radius:10px;background:#e5edff;color:#315da6;font-size:10px;font-weight:900}
    .resume-title{color:#1e3552;font-size:12px;font-weight:800}
    .resume-status{margin:4px 0 0;color:#77869b;font-size:10px;line-height:1.5}
    @media(max-width:680px){.profile-page{padding:15px 14px 40px}.profile-nav{padding:11px 12px}.profile-hero{grid-template-columns:68px minmax(0,1fr);gap:16px;margin-top:15px;padding:20px 16px}.profile-avatar{width:66px;height:66px;font-size:21px}.profile-hero h1{font-size:24px}.profile-headline{font-size:12px}.profile-content{grid-template-columns:1fr;gap:13px;margin-top:13px}.profile-panel{padding:18px}.details{gap:8px}}
  </style>
</head>
<body>
  <div class="top"></div>
  <main class="profile-page">
    <nav class="profile-nav" aria-label="Profile navigation">
      <span class="profile-brand">DIGITAL LABORATORY</span>
      <a class="back-link" href="index.html">← Back to Home</a>
    </nav>
    <section class="profile-hero" aria-labelledby="profileName">
      <div class="profile-avatar" id="profileAvatar" aria-hidden="true">DS</div>
      <div>
        <p class="eyebrow">STUDENT &amp; PROFESSIONAL PROFILE</p>
        <h1 id="profileName">Dhanush SV</h1>
        <p class="profile-headline" id="profileHeadline">Data Science Student · Mohan Babu University</p>
        <div class="profile-links" id="profileLinks" aria-label="Social profile links"></div>
      </div>
    </section>
    <div class="profile-content">
      <section class="profile-panel" aria-labelledby="idTitle">
        <div class="panel-heading"><span class="panel-mark" aria-hidden="true">ID</span><div><h2 id="idTitle">Student ID Card</h2><p>Academic identity details</p></div></div>
        <dl class="details" id="identityDetails"></dl>
      </section>
      <section class="profile-panel" aria-labelledby="professionalTitle">
        <div class="panel-heading"><span class="panel-mark" aria-hidden="true">✦</span><div><h2 id="professionalTitle">Professional Details</h2><p>Profile and career materials</p></div></div>
        <p class="professional-copy" id="professionalSummary"></p>
        <div class="resume-card"><span class="resume-icon" aria-hidden="true">PDF</span><div><div class="resume-title">Resume</div><p class="resume-status">Resume details will be added here.</p></div></div>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const defaults = {name:"dhanush sv", id:"MBU000000", section:"CSE-DS A", branch:"CSE - Data Science", faculty:"Faculty Name", designation:"Assistant Professor", subject:"DS-301", photo:"", github:"", linkedin:"", socialName:"", socialUrl:""};
      let student = defaults;
      try { student = {...defaults, ...JSON.parse(localStorage.getItem("digitalLabmanualStudent") || "{}")}; } catch (_) {}
      const text = (id, value) => { document.getElementById(id).textContent = value || "—"; };
      text("profileName", student.name);
      text("profileHeadline", `${student.designation || "Data Science Student"} · ${student.branch || "Mohan Babu University"}`);
      text("professionalSummary", `${student.name || "Student"} · ${student.branch || "Data Science"} · Mohan Babu University`);
      const avatar = document.getElementById("profileAvatar");
      if (student.photo && /^data:image\//i.test(student.photo)) { const image = document.createElement("img"); image.src = student.photo; image.alt = ""; avatar.replaceChildren(image); }
      else avatar.textContent = (student.name || "Student").trim().split(/\s+/).slice(0,2).map(part => part[0] || "").join("").toUpperCase();
      const rows = [["Student ID",student.id],["Section",student.section],["Branch",student.branch],["Subject",student.subject],["Faculty",student.faculty],["Designation",student.designation]];
      const details = document.getElementById("identityDetails");
      for (const [label,value] of rows) { const box=document.createElement("div"); box.className="detail"; const dt=document.createElement("dt"); dt.textContent=label; const dd=document.createElement("dd"); dd.textContent=value || "—"; box.append(dt,dd); details.append(box); }
      const candidates=[["GitHub",student.github],["LinkedIn",student.linkedin],[student.socialName || "Social profile",student.socialUrl]];
      const links=document.getElementById("profileLinks");
      for (const [label,raw] of candidates) { try { const url=new URL(raw); if(url.protocol!=="https:")continue; const a=document.createElement("a");a.href=url.href;a.target="_blank";a.rel="noopener noreferrer";a.textContent=`${label} ↗`;links.append(a); } catch (_) {} }
    })();
  </script>
</body>
</html>
